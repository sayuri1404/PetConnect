version: "3.8"

services:
  db:
    image: postgres:16
    container_name: paw-postgres-db
    restart: always
    environment:
      POSTGRES_DB: paw_rescue
      POSTGRES_USER: paw_admin
      POSTGRES_PASSWORD: paw_pass
    ports:
      - 5433:5433
    volumes:
      - paw_db_data:/var/lib/postgresql/data

volumes:
  paw_db_data: